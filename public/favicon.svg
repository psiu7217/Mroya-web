  <!-- Confluence Node -->
  <circle cx="16" cy="16.2" r="1.5" fill="#FFE08F"/>
  <!-- Foundation Horizon Arc -->
  <path d="M 9.8 22.5 C 13.2 24.2 18.8 24.2 22.2 22.5" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
